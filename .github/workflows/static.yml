# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public files
        # Only the site itself is published; docs, skills and tests stay in the repo.
        run: mkdir _site && cp -r index.html assets _site/ && rm -f _site/assets/js/*.test.js
      - name: Refuse 3D models
        # The part models are what the business sells; the site only ever gets drawings.
        run: |
          malhas=$(find _site -type f \( -iname '*.stl' -o -iname '*.3mf' -o -iname '*.obj' -o -iname '*.ply' -o -iname '*.glb' -o -iname '*.gltf' -o -iname '*.blend' -o -iname '*.step' -o -iname '*.stp' \))
          if [ -n "$malhas" ]; then echo "::error::3D model in the site: $malhas"; exit 1; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
